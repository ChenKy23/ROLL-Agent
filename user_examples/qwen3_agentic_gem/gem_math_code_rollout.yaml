defaults:
  - ../config/traj_envs_gem_math@_here_

hydra:
  run:
    dir: .
  output_subdir: null

exp_name: "agentic_math_code"
seed: 42
logging_dir: ./output/logs
output_dir: ./output

#track_with: wandb
#tracker_kwargs:
#  api_key:
#  project: roll-agentic
#  name: ${exp_name}_sokoban
#  notes: "agentic_pipeline"
#  tags:
#    - agentic
#    - roll
#    - baseline

track_with: tensorboard
tracker_kwargs:
  log_dir: /home/chenkaiyuan/ROLL-RL/users/tensorboard/roll_exp/agentic_rlvr

checkpoint_config:
  type: file_system
  output_dir: /home/chenkaiyuan/models/agentic-ckpt/${exp_name}

num_gpus_per_node: 4

max_steps: 1024
save_steps: 25
logging_steps: 1
eval_steps: 10
resume_from_checkpoint: false

rollout_batch_size: 180
val_batch_size: 128
sequence_length: 16384

advantage_clip: 20
ppo_epochs: 1
adv_estimator: "reinforce"

#pg_clip: 0.1
#dual_clip_loss: True
init_kl_coef: 0.0
whiten_advantages: true
entropy_loss_coef: 0
max_grad_norm: 1.0
do_validation: false

pretrain: /home/chenkaiyuan/.cache/modelscope/hub/models/Qwen/Qwen3-30B-A3B-Instruct-2507

actor_train:
  model_args:
    attn_implementation: fa2
    disable_gradient_checkpointing: false
    dtype: bf16
    model_type: ~
  training_args:
    learning_rate: 1.0e-6
    weight_decay: 0
    per_device_train_batch_size: 1
    gradient_accumulation_steps: 256
    warmup_steps: 0
    warmup_ratio: 0
    lr_scheduler_type: constant
  strategy_args:
#    strategy_name: deepspeed_train
#    strategy_config: ${deepspeed_zero3}
    strategy_name: megatron_train
    strategy_config:
      tensor_model_parallel_size: 4
      pipeline_model_parallel_size: 1
      expert_model_parallel_size: 1
      use_distributed_optimizer: true
      recompute_granularity: full
  device_mapping: list([2,3,4,5])
  infer_batch_size: 4

actor_infer:
  model_args:
    disable_gradient_checkpointing: true
    dtype: bf16
  generating_args:
    max_new_tokens: ${max_tokens_per_step} # single-turn response length
    top_p: 0.95
    top_k: 100
    num_beams: 1
    temperature: 0.6
    num_return_sequences: 1
  #   stop_strings: ["</code>"]
  # strategy_args:
  #   strategy_name: vllm
  #   strategy_config:
  #     gpu_memory_utilization: 0.8
  #     block_size: 16
  #     load_format: auto
  strategy_args:
    strategy_name: sglang
    strategy_config:
      mem_fraction_static: 0.8
  device_mapping: list([2,3,4,5])

reward_normalization:
  grouping: traj_group_id # 可以tags(env_type)/traj_group_id(group)/batch(rollout_batch)... group_by计算reward/adv
  method: identity # asym_clip / identity / mean_std

train_env_manager:
  max_env_num_per_worker: 32
  num_env_groups: 30
  # under the same group, the env config and env seed are ensured to be equal
  group_size: 6
  tags: [dapo_17k]
  num_groups_partition: [30] # If not set, all env names divide nums equally. Under the same group, the env config and env seed (prompt) are equal in each generation

# Here, you can override variables defined in the imported envs. max_tokens_per_step: 128 in custom_env.SimpleSokoban, here replaced by 64
max_tokens_per_step: 4096

math_agent_system_template: Please reason step by step, and put your final answer within '\\boxed{}', e.g. \\boxed{{A}}..
math_agent_template: "{observation}\nEnsure that your response includes the format of '\\boxed{{answer}}', e.g. \\boxed{{A}}."
custom_envs:
  dapo_17k:
    ${gem_math.dapo_17k}
  dapo_17k_with_python_code:
    ${gem_math.dapo_17k_with_python_code}